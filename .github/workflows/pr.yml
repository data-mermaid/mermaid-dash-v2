name: PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/_lint.yml

  build:
    if: github.event.pull_request.draft == false
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - if: ${{ steps.yarn-cache.outputs.cache-hit != 'true' }}
        name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn run build

  cdk-nag:
    if: github.event.pull_request.draft == false
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_errors: ${{ steps.cdk-nag.outputs.has_errors }}
      errors: ${{ steps.cdk-nag.outputs.errors }}
      warnings_count: ${{ steps.cdk-nag.outputs.warnings_count }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # cdk synth needs a dist/ dir for the S3 asset source;
      # a placeholder is sufficient since cdk-nag only validates constructs.
      - name: Create placeholder dist directory
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Fetch iac node cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: iac-cache
        with:
          path: iac/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('iac/package-lock.json') }}

      - name: Install IaC dependencies
        if: ${{ steps.iac-cache.outputs.cache-hit != 'true' }}
        working-directory: iac
        run: npm ci

      - name: CDK Nag
        id: cdk-nag
        working-directory: iac
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT}}
          CDK_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
        run: |
          set +e
          npx cdk synth --quiet 2>&1 | tee /tmp/cdk-nag.log
          synth_exit=${PIPESTATUS[0]}
          set -e

          errors=$(grep '^\[Error' /tmp/cdk-nag.log || true)
          warnings_count=$(grep -c '^\[Warning' /tmp/cdk-nag.log || true)

          {
            echo "errors<<EOF_CDK_NAG_ERRORS"
            echo "$errors"
            echo "EOF_CDK_NAG_ERRORS"
          } >> "$GITHUB_OUTPUT"
          echo "warnings_count=$warnings_count" >> "$GITHUB_OUTPUT"

          if grep -q '^\[Error' /tmp/cdk-nag.log; then
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          elif [ "$synth_exit" -ne 0 ]; then
            echo "::error::cdk synth failed with exit code $synth_exit (not a cdk-nag finding)"
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
            exit "$synth_exit"
          else
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

  # Separate job so PR comment posting (write permissions) is isolated from CDK synth (read-only).
  cdk-nag-post:
    if: always() && needs.cdk-nag.result != 'skipped'
    needs: [cdk-nag]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Post CDK Nag results to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CDK_NAG_ERRORS: ${{ needs.cdk-nag.outputs.errors }}
          CDK_NAG_WARNINGS_COUNT: ${{ needs.cdk-nag.outputs.warnings_count }}
        with:
          script: |
            const errors = (process.env.CDK_NAG_ERRORS || '').split('\n').filter(Boolean);
            const warningsCount = parseInt(process.env.CDK_NAG_WARNINGS_COUNT || '0', 10);
            let body = '## cdk-nag report\n\n';
            if (errors.length === 0) {
              body += ':white_check_mark: **No unsuppressed errors.**\n';
            } else {
              body += `:x: **${errors.length} unsuppressed error(s):**\n\n`;
              body += '```\n' + errors.join('\n') + '\n```\n';
            }
            if (warningsCount > 0) {
              body += `\n:warning: ${warningsCount} warning(s)\n`;
            }
            body += '\n---\n*See `iac/nag-suppressions.ts` to add suppressions for accepted risks.*';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes('## cdk-nag report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on CDK Nag errors
        if: needs.cdk-nag.outputs.has_errors == 'true' || needs.cdk-nag.result == 'failure'
        run: |
          echo "::error::cdk-nag found unsuppressed errors — see PR comment for details"
          exit 1

  cdk-diff:
    if: github.event.pull_request.draft == false
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      diff: ${{ steps.cdk-diff.outputs.diff }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Create placeholder dist directory
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEPLOY_ROLE: ${{ secrets.CDK_DEPLOY_ROLE }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.CDK_DEFAULT_ACCOUNT }}:role/${{ secrets.CDK_DEPLOY_ROLE }}
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Fetch iac node cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: iac-cache
        with:
          path: iac/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('iac/package-lock.json') }}

      - name: Install IaC dependencies
        if: ${{ steps.iac-cache.outputs.cache-hit != 'true' }}
        working-directory: iac
        run: npm ci

      - name: CDK Diff
        id: cdk-diff
        working-directory: iac
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
        run: |
          set +e
          npx cdk diff 2>&1 | sed 's/\x1b\[[0-9;]*[mGKHF]//g' | tee /tmp/cdk-diff.log
          set -e

          raw=$(cat /tmp/cdk-diff.log)
          MAX=50000
          if [ "${#raw}" -gt "$MAX" ]; then
            raw="${raw:0:$MAX}"$'\n''…(truncated — see full log in Actions)'
          fi
          {
            echo "diff<<EOF_CDK_DIFF"
            printf '%s\n' "$raw"
            echo "EOF_CDK_DIFF"
          } >> "$GITHUB_OUTPUT"

  # Separate job so PR comment posting (write permissions) is isolated from CDK diff (OIDC/read-only).
  cdk-diff-post:
    if: always() && needs.cdk-diff.result != 'skipped'
    needs: [cdk-diff]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Post CDK diff to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CDK_DIFF: ${{ needs.cdk-diff.outputs.diff }}
          GH_SHA: ${{ github.sha }}
        with:
          script: |
            const raw = (process.env.CDK_DIFF || '').trim();
            const noChanges = raw.includes('There were no differences');

            let body = '## cdk diff\n\n';
            if (noChanges) {
              body += ':white_check_mark: **No infrastructure changes.**\n';
            } else {
              body += ':memo: **Infrastructure changes detected:**\n\n';
              body += '<details>\n<summary>Show diff</summary>\n\n```\n' + raw + '\n```\n</details>\n';
            }
            body += `\n---\n*Updated for commit \`${process.env.GH_SHA}\`*`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes('## cdk diff'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
