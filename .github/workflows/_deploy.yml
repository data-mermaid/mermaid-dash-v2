name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      domain:
        required: true
        type: string
      vite_react_app_auth0_domain:
        required: true
        type: string
      vite_react_app_auth0_client_id:
        required: true
        type: string
      vite_react_app_auth0_audience:
        required: true
        type: string
      vite_react_app_mermaid_collect_link:
        required: true
        type: string
      vite_react_app_mermaid_api_endcpoint:
        required: true
        type: string
      vite_environment:
        required: true
        type: string
    secrets:
      MAP_TILER_API_KEY:
        required: true
      POST_HOG_KEY:
        required: false
      VITE_SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      CDK_DEFAULT_ACCOUNT:
        required: true
      CDK_DEPLOY_ROLE:
        required: true
      CDK_DEFAULT_REGION:
        required: true

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      - if: ${{ steps.yarn-cache.outputs.cache-hit != 'true' }}
        name: Install dependencies
        run: yarn install --frozen-lockfile

      # Must run before Build so VITE_APP_VERSION is available in $GITHUB_ENV when Vite compiles
      - name: Set app version
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ "$GH_REF" == refs/tags/* ]]; then
            echo "VITE_APP_VERSION=$GH_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VITE_APP_VERSION=$(git rev-parse --short "$GH_SHA")" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: yarn run build
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
          VITE_REACT_APP_AUTH0_DOMAIN: ${{ inputs.vite_react_app_auth0_domain }}
          VITE_REACT_APP_AUTH0_CLIENT_ID: ${{ inputs.vite_react_app_auth0_client_id }}
          VITE_REACT_APP_AUTH0_AUDIENCE: ${{ inputs.vite_react_app_auth0_audience }}
          VITE_REACT_APP_MERMAID_COLLECT_LINK: ${{ inputs.vite_react_app_mermaid_collect_link }}
          VITE_REACT_APP_MERMAID_API_ENDPOINT: ${{ inputs.vite_react_app_mermaid_api_endcpoint }}
          VITE_REACT_APP_MAP_TILER_API_KEY: ${{ secrets.MAP_TILER_API_KEY }}
          VITE_ENVIRONMENT: ${{ inputs.vite_environment }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.POST_HOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Install IaC dependancies
        working-directory: iac
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEPLOY_ROLE: ${{ secrets.CDK_DEPLOY_ROLE }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.CDK_DEFAULT_ACCOUNT }}:role/${{ secrets.CDK_DEPLOY_ROLE }}
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Deploy
        run: |
          echo "Deploying to $DEPLOY_ENV with domain $DEPLOY_DOMAIN" && \
          cd iac && npx cdk deploy --require-approval never
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_DOMAIN: ${{ inputs.domain }}
          AWS_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
          CDK_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          GITHUB_TOKEN: ${{ github.token }}
          ENV: ${{ inputs.environment }}
          DOMAIN: ${{ inputs.domain }}
